name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm generate
        env:
          CF_PAGES: "1"
          CF_PAGES_BRANCH: main
          CF_PAGES_URL: https://ci.portfolio-hub-nuxt.pages.dev
      - run: pnpm test:pages
