<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="400" viewBox="0 0 1140 400" role="img" aria-labelledby="title desc">
  <title id="title">Home Server 3D — Architecture</title>
  <desc id="desc">A visitor opens the 3D page on Cloudflare Pages, and a status API reads the Lightsail server's metrics from Grafana Cloud and returns a public summary. The scene is built in Blender on my PC and deployed with git push.</desc>
  <defs><marker id="solid" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8c9c90" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="solid-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#8c9c90" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#b49b72" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#b49b72" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1140" height="400" rx="20" fill="#fdfdfb"/>
  <g font-family="Geist, Arial, Helvetica, sans-serif"><rect x="310" y="50" width="230" height="320" rx="18" fill="#faf7f1" stroke="#ebe3d6" stroke-dasharray="5 5"/><text x="324" y="70" font-size="12" fill="#71675e">Cloudflare Pages</text><path d="M160 138 L350.5 138" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M425 184 L425 266" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M494.5 300 L674 300" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)" marker-start="url(#solid-start)"/><path d="M949.5 300 L826 300" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M160 300 L233 300 Q245 300 245 288 L245 176 Q245 164 257 164 L350.5 164" fill="none" stroke="#b49b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#dashed)"/><g text-anchor="middle"><rect x="40" y="116" width="120" height="68" rx="16" fill="#fbf4e6" stroke="#ddcfb4"/><text x="100" y="145" font-size="15" font-weight="600" fill="#6f5a39">Visitor</text><text x="100" y="166" font-size="12" fill="#806a47">Browser</text><rect x="350.5" y="116" width="149" height="68" rx="16" fill="#edf5ee" stroke="#c8d8cb"/><text x="425" y="145" font-size="15" font-weight="600" fill="#344c3b">3D web viewer</text><text x="425" y="166" font-size="12" fill="#5e6f5c">three.js · GLB</text><rect x="355.5" y="266" width="139" height="68" rx="16" fill="#edf5ee" stroke="#c8d8cb"/><text x="425" y="295" font-size="15" font-weight="600" fill="#344c3b">Status API</text><text x="425" y="316" font-size="12" fill="#5e6f5c">Pages Functions</text><rect x="674" y="266" width="152" height="68" rx="16" fill="#f3ece1" stroke="#e0d6c6"/><text x="750" y="295" font-size="15" font-weight="600" fill="#231d18">Grafana Cloud</text><text x="750" y="316" font-size="12" fill="#6b6158">Prometheus</text><rect x="949.5" y="266" width="171" height="68" rx="16" fill="#edf5ee" stroke="#c8d8cb"/><text x="1035" y="295" font-size="15" font-weight="600" fill="#344c3b">AWS Lightsail</text><text x="1035" y="316" font-size="12" fill="#5e6f5c">13 containers · Alloy</text><rect x="40" y="266" width="120" height="68" rx="16" fill="#fbf4e6" stroke="#ddcfb4"/><text x="100" y="295" font-size="15" font-weight="600" fill="#6f5a39">My PC</text><text x="100" y="316" font-size="12" fill="#806a47">Blender · Git</text><rect x="393.5" y="214" width="63" height="22" rx="11" fill="#f5f9f5" stroke="#d8e4d9"/><text x="425" y="229" font-size="12" fill="#4c6050">Status</text><rect x="551.8" y="289" width="65" height="22" rx="11" fill="#f5f9f5" stroke="#d8e4d9"/><text x="584.3" y="304" font-size="12" fill="#4c6050">PromQL</text><rect x="852.8" y="289" width="70" height="22" rx="11" fill="#f5f9f5" stroke="#d8e4d9"/><text x="887.8" y="304" font-size="12" fill="#4c6050">Metrics</text><rect x="208.5" y="221" width="73" height="22" rx="11" fill="#fbf7ef" stroke="#e5d9c4"/><text x="245" y="236" font-size="12" fill="#7d6643">git push</text></g></g>
