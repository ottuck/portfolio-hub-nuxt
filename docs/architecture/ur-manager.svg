<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">UR Manager — Architecture</title>
  <desc id="desc">The web app, served from a Cloudflare Worker, calls a Spring Boot API on Azure, and sign-in goes through Entra External ID. Separate scheduled jobs check UR every two hours and send alert emails without touching the web side.</desc>
  <defs><marker id="solid" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8c9c90" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="solid-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#8c9c90" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#b49b72" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#b49b72" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1120" height="410" rx="20" fill="#fdfdfb"/>
