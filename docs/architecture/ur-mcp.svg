<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
  <title id="title">UR MCP App — Architecture</title>
  <desc id="desc">You talk to Claude or ChatGPT, which calls the MCP server's tools and shows rooms as cards. The server also checks UR itself three times a day and keeps the history in SQLite, so the AI can report what changed.</desc>
